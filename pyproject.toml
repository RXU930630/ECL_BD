[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "persson-contact"
version = "0.2.0rc7"
description = "Persson contact, elastic mixed lubrication and interface shear-strength fitting"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "scipy>=1.13", "openpyxl>=3.1.5"]

[project.optional-dependencies]
plots = ["matplotlib>=3.8"]

[project.scripts]
persson-contact = "persson_contact.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
